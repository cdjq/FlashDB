paragraph=FlashDB is an ultra-lightweight embedded database. It provides KVDB (key-value database) and TSDB (time series database) modes with wear leveling and power-off protection, storing data directly on flash without a file system. This Arduino port runs on ESP32 using a flash partition as storage backend.
